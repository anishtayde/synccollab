services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synccollab-postgres
    environment:
      POSTGRES_USER: synccollab
      POSTGRES_PASSWORD: synccollab
      POSTGRES_DB: synccollab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: